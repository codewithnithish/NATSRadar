apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "natscope.fullname" . }}
  labels:
    {{- include "natscope.labels" . | nindent 4 }}
data:
  NATS_URL: {{ .Values.natscope.natsUrl | quote }}
  NATSCOPE_DEFAULT_CONNECTION_NAME: {{ .Values.natscope.defaultConnectionName | quote }}
  NATSCOPE_READ_ONLY: {{ .Values.natscope.readOnly | quote }}
  NATSCOPE_LOG_LEVEL: {{ .Values.natscope.logLevel | quote }}
  NATSCOPE_AUTH_ENABLED: {{ .Values.natscope.auth.enabled | quote }}
  {{- if .Values.persistence.enabled }}
  NATSCOPE_STORAGE_PATH: "{{ .Values.persistence.mountPath }}/connections.json"
  {{- end }}


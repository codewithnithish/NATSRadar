{{- if and .Values.natscope.auth.enabled (not .Values.natscope.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "natscope.fullname" . }}
  labels:
    {{- include "natscope.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.natscope.auth.userKey | default "NATSCOPE_AUTH_USER" }}: {{ .Values.natscope.auth.user | quote }}
  {{ .Values.natscope.auth.passwordKey | default "NATSCOPE_AUTH_PASS" }}: {{ .Values.natscope.auth.password | quote }}
{{- end }}


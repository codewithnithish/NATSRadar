# Default values for natscope.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: codewithnithish/natscope
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: natscope.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: natscope-tls
  #    hosts:
  #      - natscope.local

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Natscope Application Settings
natscope:
  # The URL of the primary NATS cluster to connect to on boot.
  # e.g., "nats://nats.nats.svc.cluster.local:4222" or "tls://nats.mycompany.com:4222"
  natsUrl: "nats://nats:4222"

  # Display name for the default NATS connection in the UI
  defaultConnectionName: "Kubernetes NATS"

  # If true, mutations (purge, delete stream/bucket/key, publish) are disabled
  readOnly: false

  # Log level: debug, info, warn, error
  logLevel: "info"

  # Built-in Web UI / API Authentication
  auth:
    enabled: true
    user: "admin"
    password: "admin@123"
    # To load credentials from an existing Kubernetes Secret instead:
    existingSecret: ""
    userKey: "NATSCOPE_AUTH_USER"
    passwordKey: "NATSCOPE_AUTH_PASS"

  # S3 External Object Storage Provider (Alternative or supplement to volume persistence)
  # Supported: AWS S3, MinIO, Ceph, Cloudflare R2, Wasabi, Google Cloud Storage
  s3:
    enabled: false
    endpoint: "s3.amazonaws.com"
    bucket: "natscope-storage"
    prefix: "clusters/"
    region: "us-east-1"
    useSSL: true
    storageClass: "STANDARD" # STANDARD | STANDARD_IA | INTELLIGENT_TIERING | GLACIER
    ttlDays: 30              # Automatic object expiration / lifecycle in days (0 = no TTL)
    maxBytes: 0              # Bucket storage quota limit in bytes (0 = unlimited)
    # Existing Secret containing AWS credentials
    existingSecret: ""
    accessKeyKey: "AWS_ACCESS_KEY_ID"
    secretKeyKey: "AWS_SECRET_ACCESS_KEY"

# Persistence configuration supporting all Kubernetes volume types:
# - pvc: Dynamic provisioning through a StorageClass
# - existingClaim: Attach to an already existing PVC / PV
# - nfs: Direct Network File System mount
# - hostPath: Local node disk path
# - emptyDir: Ephemeral container storage
persistence:
  enabled: true
  type: "pvc" # pvc | existingClaim | nfs | hostPath | emptyDir
  mountPath: /data

  # Settings for type: pvc
  pvc:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}

  # Settings for type: existingClaim
  existingClaim:
    name: ""

  # Settings for type: nfs
  nfs:
    server: ""
    path: ""
    readOnly: false

  # Settings for type: hostPath
  hostPath:
    path: "/var/lib/natscope"
    type: "DirectoryOrCreate"

# Probes
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

nodeSelector: {}

tolerations: []

affinity: {}


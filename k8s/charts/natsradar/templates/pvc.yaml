{{- if and .Values.persistence.enabled (eq .Values.persistence.type "pvc") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "natsradar.fullname" . }}-data
  labels:
    {{- include "natsradar.labels" . | nindent 4 }}
  {{- with .Values.persistence.pvc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.pvc.accessMode | default "ReadWriteOnce" | quote }}
  {{- if .Values.persistence.pvc.storageClass }}
  storageClassName: {{ .Values.persistence.pvc.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.size | default "1Gi" | quote }}
{{- end }}


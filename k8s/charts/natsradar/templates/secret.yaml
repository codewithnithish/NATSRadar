{{- if and .Values.natsradar.auth.enabled (not .Values.natsradar.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "natsradar.fullname" . }}
  labels:
    {{- include "natsradar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.natsradar.auth.userKey | default "NATSRADAR_AUTH_USER" }}: {{ .Values.natsradar.auth.user | quote }}
  {{ .Values.natsradar.auth.passwordKey | default "NATSRADAR_AUTH_PASS" }}: {{ .Values.natsradar.auth.password | quote }}
{{- end }}


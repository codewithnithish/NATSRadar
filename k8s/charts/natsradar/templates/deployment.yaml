apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "natsradar.fullname" . }}
  labels:
    {{- include "natsradar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "natsradar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.natsradar.auth.enabled (not .Values.natsradar.auth.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "natsradar.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "natsradar.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "natsradar.fullname" . }}
          {{- if .Values.natsradar.auth.enabled }}
          env:
            - name: NATSRADAR_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "natsradar.secretName" . }}
                  key: {{ .Values.natsradar.auth.userKey | default "NATSRADAR_AUTH_USER" }}
            - name: NATSRADAR_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "natsradar.secretName" . }}
                  key: {{ .Values.natsradar.auth.passwordKey | default "NATSRADAR_AUTH_PASS" }}
          {{- end }}
          {{- if and .Values.natsradar.s3.enabled .Values.natsradar.s3.existingSecret }}
            - name: NATSRADAR_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.natsradar.s3.existingSecret }}
                  key: {{ .Values.natsradar.s3.accessKeyKey | default "AWS_ACCESS_KEY_ID" }}
            - name: NATSRADAR_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.natsradar.s3.existingSecret }}
                  key: {{ .Values.natsradar.s3.secretKeyKey | default "AWS_SECRET_ACCESS_KEY" }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          {{- if eq .Values.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "natsradar.fullname" . }}-data
          {{- else if eq .Values.persistence.type "existingClaim" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim.name }}
          {{- else if eq .Values.persistence.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.nfs.server | quote }}
            path: {{ .Values.persistence.nfs.path | quote }}
            readOnly: {{ .Values.persistence.nfs.readOnly | default false }}
          {{- else if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path | quote }}
            type: {{ .Values.persistence.hostPath.type | default "DirectoryOrCreate" | quote }}
          {{- else if eq .Values.persistence.type "emptyDir" }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}


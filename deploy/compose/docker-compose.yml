# Local stack: NATS (JetStream on) + Natscope.
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   docker compose -f deploy/compose/docker-compose.yml --profile seed run --rm seed
services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  natscope:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      NATSCOPE_STORAGE_PATH: /data/connections.json
      NATSCOPE_AUTH_ENABLED: "true"
      NATSCOPE_AUTH_USER: "admin"
      NATSCOPE_AUTH_PASS: "admin@123"
    volumes:
      - natscope-data:/data
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/natscope-seed"]
    command: ["-url", "nats://nats:4222"]
    depends_on:
      nats:
        condition: service_healthy

volumes:
  nats-data:
  natscope-data:

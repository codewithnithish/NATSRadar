# Full Stack: NATS (JetStream on) + NATSRadar
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml --profile seed run --rm seed
services:
  nats:
    image: nats:2-alpine
    container_name: nats-server
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
      - "7422:7422"
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  natsradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: natsradar-ui
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATSRADAR_STORAGE_PATH: ${NATSRADAR_STORAGE_PATH:-/data/connections.json}
      NATSRADAR_AUTH_ENABLED: "${NATSRADAR_AUTH_ENABLED:-true}"
      NATSRADAR_AUTH_USER: "${NATSRADAR_AUTH_USER:-admin}"
      NATSRADAR_AUTH_PASS: "${NATSRADAR_AUTH_PASS:-admin@123}"
      NATSRADAR_DEFAULT_CONNECTION_NAME: "${NATSRADAR_DEFAULT_CONNECTION_NAME:-Docker NATS}"
    volumes:
      - natsradar-data:/data
    ports:
      - "${NATSRADAR_PORT:-${NATSCOPE_PORT:-8080}}:8080"
    depends_on:
      nats:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/natsradar-seed"]
    command: ["-url", "nats://nats:4222"]
    depends_on:
      nats:
        condition: service_healthy

  leaf-edge:
    profiles: ["leaf"]
    image: nats:2-alpine
    container_name: nats-leaf-edge
    command:
      - "-c"
      - "/etc/nats/leaf-edge.conf"
    volumes:
      - ./leaf-edge.conf:/etc/nats/leaf-edge.conf:ro
    depends_on:
      nats:
        condition: service_healthy

volumes:
  nats-data:
  natsradar-data:


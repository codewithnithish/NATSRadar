# Standalone NATSRadar UI (Connects to an existing NATS Server)
# Usage:
#   docker compose -f docker/standalone.yml up -d
services:
  natsradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: natsradar-ui
    environment:
      # Use host.docker.internal to reach NATS running on the host machine
      NATS_URL: ${NATS_URL:-nats://host.docker.internal:4222}
      NATSRADAR_STORAGE_PATH: /data/connections.json
      NATSRADAR_AUTH_ENABLED: "${NATSRADAR_AUTH_ENABLED:-true}"
      NATSRADAR_AUTH_USER: "${NATSRADAR_AUTH_USER:-admin}"
      NATSRADAR_AUTH_PASS: "${NATSRADAR_AUTH_PASS:-admin@123}"
      NATSRADAR_DEFAULT_CONNECTION_NAME: "${NATSRADAR_DEFAULT_CONNECTION_NAME:-Host NATS}"
    volumes:
      - natsradar-data:/data
    ports:
      - "${NATSRADAR_PORT:-${NATSCOPE_PORT:-8080}}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  natsradar-data:

